[project]
name = "jarvis"
version = "0.1.0"
description = "Uzbek-speaking voice agent for Windows: Gemini Live ears+mouth, Claude Code hands, full PC control"
requires-python = ">=3.11,<3.13"
license = "MIT"
readme = "README.md"

dependencies = [
    "google-genai>=1.30.0",
    "sounddevice>=0.5.1",
    "numpy>=1.26,<3",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.20.0",
    "aiohttp>=3.11",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "telethon>=1.36",
    # --- Windows-only. Marked so the package still installs on Linux/macOS
    # for testing; the tools that need them report a clear error there.
    "mss>=9.0; sys_platform == 'win32'",
    "pyperclip>=1.9; sys_platform == 'win32'",
    "winotify>=1.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit, so the result does not depend on whatever global ruff config
# happens to be installed on the machine running it.
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "UP041",   # asyncio.TimeoutError reads clearer next to asyncio.wait_for
    "ASYNC109",# `timeout` is a deliberate part of the tool schema Gemini calls
    "ASYNC240",# advice is trio-specific; these are cheap stat() calls on asyncio
]

[tool.pytest.ini_options]
testpaths = ["tests"]
