# ============================================================
#  JARVIS (Windows) — configuration
#  Everything you'd normally want to change lives in this file.
# ============================================================

agent:
  # Cosmetic only — the wake word is set under wake.model and the spoken
  # language is pinned in persona.py and gemini.language_code.
  name: "Jarvis"
  language: "uz"

  # --------------------------------------------------------
  #  AUTONOMY — the single most important line in this file.
  #
  #  "guarded" : reads, screenshots and app launches run
  #              instantly; destructive commands (Remove-Item,
  #              format, taskkill, winget install, registry
  #              writes, git push) speak a confirmation and
  #              wait for you to type y / ha.
  #
  #  "full"    : every tool runs immediately, no confirmation.
  #              Fastest, most Jarvis-like. A misheard voice
  #              command CAN delete files. Everything is still
  #              written to logs/audit.jsonl.
  #
  #  Currently shipped as "full". run_shell is PowerShell with your
  #  full user rights and speech recognition is not perfect — a
  #  misheard command CAN delete files with nothing standing in the
  #  way except your own attention to what you actually said.
  #  Every call is still written to logs/audit.jsonl either way, but
  #  that's a record, not a safeguard. If you'd rather have destructive
  #  commands ask first while you get a feel for it, set this to
  #  "guarded" — spend a day there before flipping back to "full".
  #
  #  Flip this one word to change behaviour. Nothing else.
  # --------------------------------------------------------
  autonomy: "full"

# ---------------- Wake word ----------------
wake:
  enabled: true
  # openWakeWord ships a pretrained "hey_jarvis" model — no training,
  # no API key, runs locally on CPU in ~1% of one core.
  model: "hey_jarvis"
  # 0.0-1.0. Lower = triggers more easily (more false wakes).
  # 0.5 is a good start; raise to 0.6-0.7 in a noisy room.
  threshold: 0.5
  # Seconds of silence before Jarvis closes the session and goes back to
  # sleep. Until it sleeps you can keep talking WITHOUT saying "Hey Jarvis"
  # again — this is the length of the follow-up window.
  # Longer = more natural conversation, but you're billed for the open
  # session (~$0.005/min), so don't set this to minutes.
  silence_timeout: 20.0
  # Play a short blip when the wake word fires.
  chime: true

# ---------------- Gemini Live ----------------
gemini:
  # Realtime audio socket. Must be a model that supports bidiGenerateContent.
  # Alternatives: gemini-2.5-flash-native-audio-latest
  model: "gemini-3.1-flash-live-preview"

  # Turn-based text model, used by `--text` mode and screen vision.
  # Not the Live model — that one only speaks over a WebSocket.
  text_model: "gemini-3.7-flash"

  # Preview models return 503 under load. If the primary is busy, Jarvis walks
  # down this list rather than failing at you. Order matters: newest first.
  #
  # Deliberately NOT including gemini-2.5-flash or gemini-3.5-flash here: on a
  # free-tier key both carry the same 20-requests-PER-DAY cap (not
  # per-minute), so they silently exhaust after light use and then every call
  # that reaches them fails with a 429 RESOURCE_EXHAUSTED buried at the bottom
  # of the fallback chain — which is exactly what caused see_screen and other
  # text/vision calls to hard-fail, and later stalled the Telegram bot mid-task
  # once gemini-3.5-flash's daily quota ran out. Better to run out of
  # fallbacks and fail with one clear error than to quietly hit that trap.
  text_model_fallbacks:
    - "gemini-3.6-flash"

  # Which sex Jarvis's voice is, used when tts.backend = "gemini". Only
  # matters if `voice` below is left null — set to whichever persona you
  # want and Jarvis picks a good default voice for it:
  #   "male"   -> Charon, an even, "informative" newsreader-style voice —
  #               the clearest of the 8 prebuilt voices across languages,
  #               Uzbek included. Fenrir and Orus were tried first and both
  #               came back sounding more accented and harder to follow.
  #   "female" -> Kore, a firm, confident voice.
  voice_gender: "male"

  # Explicit voice override. Leave null to let voice_gender (above) choose.
  # Set this instead to pin an exact voice by name and skip the gender
  # default entirely — any Gemini Live prebuilt voice name works, but the
  # half-cascade model this config uses only actually accepts these 8:
  # Puck, Charon, Kore, Fenrir, Aoede, Leda, Orus, Zephyr.
  voice: null

  # --------------------------------------------------------
  #  Pin the speech language. This matters a lot for Uzbek.
  #
  #  Left unset, the model auto-detects language per utterance —
  #  and it reliably mistakes Uzbek for Spanish or Turkish,
  #  because those are far commoner in its training data.
  #  ("Batareyam necha foiz" came back as "Bateria de mi coche".)
  #  It usually still gets your INTENT right, but the transcript
  #  is wrong and it occasionally answers the wrong question.
  #
  #  Pinning uz-UZ removes that guesswork.
  #
  #  Cost: no automatic mid-sentence switching to Russian or
  #  English. Set to null if you'd rather have the switching and
  #  accept the misrecognition.
  #
  #  NOTE: only half-cascade Live models accept this. The
  #  gemini-2.5-flash-native-audio-* models reject uz-UZ and will
  #  fail to connect — set this to null if you switch to one.
  # --------------------------------------------------------
  language_code: "uz-UZ"
  # Let Gemini send us text transcripts alongside audio, so we can
  # log the conversation and mirror it into memory.
  transcripts: true

  # Let Jarvis answer factual questions (weather, news, exchange rates) from
  # Google Search instead of opening a browser tab at you. If the server ever
  # refuses Search alongside our own tools, Jarvis drops it and reconnects
  # automatically — it won't leave you with a dead wake word.
  google_search: true

  # Server-side voice activity detection. Works together with
  # audio.echo_mode to stop Jarvis interrupting itself.
  vad:
    # THE echo fix. false = the server refuses to let incoming audio cut off
    # a reply in progress, so Jarvis cannot interrupt itself no matter what
    # leaks from your speakers into the mic. You lose the ability to interrupt
    # it too — set this to true once you're wearing headphones.
    allow_interruption: false

    # LOW = needs clearer, more confident speech before deciding you've
    # started talking. This is what stops stray echo cutting Jarvis off.
    # Set to HIGH if it's ignoring you when you genuinely do interrupt.
    start_sensitivity: "LOW"
    # LOW = waits longer before deciding you've finished. Helps if Jarvis
    # jumps in while you're still thinking mid-sentence.
    end_sensitivity: "LOW"
    # Audio kept from just before speech was detected, so your first
    # syllable isn't clipped.
    prefix_padding_ms: 300
    # How long you must be quiet before Jarvis takes its turn.
    silence_duration_ms: 900

# ---------------- Speech output ----------------
tts:
  # "gemini" : native audio out of the Live model. ~0.5s, supports
  #            barge-in. This is the default and what you want.
  #
  # "aisha"  : route spoken output through Aisha AI's Uzbek voice
  #            instead. Better Uzbek accent, but their API is
  #            request/response (no streaming), so expect +1.5-3s
  #            per reply and NO barge-in. Understanding still runs
  #            on Gemini either way.
  #            Requires AISHA_API_KEY in .env AND ffmpeg on PATH:
  #              winget install Gyan.FFmpeg
  #
  # Try "gemini" first. Only switch if the Uzbek accent bothers you.
  backend: "gemini"

  aisha:
    model: "Gulnoza"        # currently their only named Uzbek voice
    mood: "Neutral"         # Neutral | Cheerful | Happy | Sad
    speed: 1.0              # 0.5 - 2.0
    max_chars: 1000         # hard API limit; longer text is chunked

# ---------------- Claude Code (the fallback "hands") ----------------
# Gemini is the voice and the reflexes, and — via delegate_to_gemini — the
# DEFAULT hands too: multi-step work (writing code, refactoring, research,
# automation) is driven through Gemini's own tool loop first, spending
# Gemini quota rather than Claude's. Claude Code only gets used as a
# fallback when the Gemini agent fails outright, or when explicitly asked
# for.
#
#   npm install -g @anthropic-ai/claude-code
#
# If the CLI isn't installed, Jarvis hides the Claude delegation tools
# rather than offering something that always fails — delegate_to_gemini
# still works without it.
claude:
  enabled: true
  command: "claude"
  # Sonnet handles the large majority of delegated tasks (coding, file edits,
  # research) for a fraction of Opus's token cost. If a Sonnet run fails
  # outright (non-zero exit, not a timeout), Jarvis automatically retries the
  # SAME task once on escalate_model before giving up — so you only pay the
  # Opus premium on the tasks that actually needed it, not on every call.
  #
  # Deliberately NOT Haiku here: delegate_to_claude is reserved for the hard
  # cases (multi-file refactors, real reasoning) — Gemini's own agent
  # (delegate_to_gemini) already handles the easy majority of delegated work
  # for free, so what actually reaches Claude needs Sonnet-or-better
  # capability. Dropping to Haiku here would trade real accuracy for a
  # cost saving on exactly the tasks that can least afford it.
  model: "sonnet"
  escalate_model: "opus"
  # Max seconds to let a delegated task run before giving up.
  timeout: 900
  # Where a delegated task runs by default when the request doesn't name a
  # path. Shared by delegate_to_claude AND delegate_to_gemini. "~" resolves
  # to C:\Users\<you>.
  default_cwd: "~"

# ---------------- OpenClaw (self-hosted brain, spends neither Gemini nor Claude quota) ----------------
# A separately-running OpenClaw deployment (Docker) with its own Telegram bot,
# skills, and a custom non-Gemini/Claude model. delegate_to_openclaw hands it
# substantial tasks the same way delegate_to_gemini/delegate_to_claude do,
# through its own `openclaw agent` CLI run inside the gateway container.
# Set up separately — see docs/OPENCLAW.md. Hidden entirely if `docker` isn't
# on PATH or the container isn't running.
openclaw:
  enabled: true
  # Container running the OpenClaw gateway (docker-compose service
  # `openclaw-gateway`, named `<project>-openclaw-gateway-1` by default).
  container: "workshop-openclaw-gateway-1"
  # Which OpenClaw agent id to talk to (config/openclaw.json -> agents.list).
  agent_id: "main"
  # Max seconds to let a delegated task run before giving up.
  timeout: 300

# ---------------- Telegram ----------------
# Lets Jarvis send messages to your Telegram contacts by voice, as YOU (via
# the MTProto user API, not a bot — a bot can't message someone who hasn't
# started a chat with it first). Needs TELEGRAM_API_ID / TELEGRAM_API_HASH in
# .env (free, from https://my.telegram.org/apps) and a one-time interactive
# login: `python -m jarvis --telegram-login`. Hidden from Jarvis entirely
# until both the credentials and a logged-in session exist.
telegram:
  # Where the logged-in session is saved (".session" is appended by Telethon).
  session_path: "data/telegram"

# ---------------- Telegram bot (give Jarvis tasks from your phone) ----------------
# A second, separate Telegram identity: your OWN bot (a token from
# @BotFather), which listens for messages FROM you instead of sending as you.
# Text or voice notes sent to the bot run through the same tool registry the
# microphone uses (run_shell, open_app, file I/O, ...), so this works even
# when you're away from the PC's mic. Needs, in .env:
#   TELEGRAM_BOT_TOKEN          — from @BotFather
#   TELEGRAM_API_ID/API_HASH    — same ones telegram: above uses
# and, below, allow_from with your own numeric Telegram user id (find it by
# messaging @userinfobot). An empty allow_from means the bot stays off —
# never treated as "allow everyone".
telegram_bot:
  enabled: true
  # Numeric Telegram user ids allowed to command Jarvis this way. Put YOUR
  # OWN id here (message @userinfobot to find it) — this list is the bot's
  # only access control, and it must never be shipped with somebody else's
  # id in it. Left empty the bot stays off, which is the safe default: a
  # bot that refuses everyone is a nuisance, one that obeys the wrong
  # person is a remote shell on your PC.
  allow_from: []
  # "gemini" (default, spends Gemini quota) or "custom" (spends the
  # custom_model below instead — falls back to gemini if that isn't set up).
  brain: "gemini"
  max_steps: 20
  session_path: "data/telegram_bot"
  # Where the bot keeps its own "is it working" status (running/stopped/
  # error, bot username, last message time) — check it with
  # `python -m jarvis --bot-status`, or read logs/jarvis.log for the
  # full history.
  status_path: "data/telegram_bot_status.json"

# ---------------- Custom model (bring your own brain) ----------------
# A pluggable slot for any OpenAI-compatible chat-completions endpoint (with
# tool calling) to run delegated tasks on, instead of Gemini or Claude —
# useful for spending neither of their quotas, or just to use a model you
# already pay for elsewhere. Put its key in the env var named by
# api_key_env. Hidden entirely until base_url, model and that key are all
# set.
custom_model:
  enabled: true
  base_url: ""             # e.g. "https://api.your-provider.com/v1"
  model: ""                # e.g. "gpt-5.4"
  api_key_env: "CUSTOM_MODEL_API_KEY"
  max_steps: 20
  timeout: 120

# ---------------- Audio plumbing ----------------
audio:
  input_rate: 16000     # Gemini Live requires 16kHz PCM in
  output_rate: 24000    # Gemini Live emits 24kHz PCM out
  chunk_ms: 32
  # null = system default. To pin a device, run:
  #   python -m jarvis --devices
  # and put the integer index here.
  input_device: null
  output_device: null

  # ---------------- ECHO CONTROL ----------------
  # Read this if Jarvis keeps cutting itself off mid-sentence. On laptop
  # speakers the mic picks up Jarvis's own voice, Gemini's VAD reads that as
  # you interrupting, and it stops talking.
  #
  #   "gate" : measure how loud the echo is at the start of each reply, then
  #            only forward mic audio clearly louder than that. Kills the echo
  #            but you CAN still interrupt by speaking up.
  #
  #   "mute" : mic is completely deaf while Jarvis speaks. Bulletproof against
  #            echo, but interrupting becomes impossible.
  #
  #   "open" : no gating at all. Correct when you're on headphones — there is
  #            no echo to cancel and this gives the snappiest barge-in.
  #
  # Shipped as "mute" because the gate calibrates in the first ~130 ms after
  # audio is QUEUED, and laptop speakers haven't physically ramped up by then —
  # it measures near-silence and sets the bar far too low. Switch to "open" the
  # moment you put headphones on.
  echo_mode: "mute"

  # Gate tuning. Only used when echo_mode is "gate".
  #   multiplier — how much louder than the measured echo your voice must be.
  #                Raise to 3-4 if Jarvis still interrupts itself.
  #                Lower to ~1.8 if you have to shout to interrupt it.
  #   min_rms    — absolute floor, so a silent room can't set the bar at zero.
  echo_gate_multiplier: 2.5
  echo_gate_min_rms: 900

# ---------------- Visual HUD ----------------
# The "dynamic Jarvis interface": a frameless, always-on-top holographic
# HUD — dark glass, an electric-cyan arc-reactor ring, a sweeping radar
# bezel and corner targeting brackets, styled after the movie interface.
# It opens as a real, sizeable panel the moment Jarvis starts (not a
# hidden tray icon), settles to a smaller idle ring while asleep, and the
# instant there's anything to show it grows into the full panel — cyan
# while listening, amber while a tool runs, a bigger pulsing equalizer
# while it speaks, red on error — then eases back down once the
# conversation ends. Purely visual, no on-screen text. Drag it anywhere
# with the mouse — it remembers where you put it (data/ui_overlay_pos.json).
#
# Needs PySide6 (pip install -e . already pulls it in). If it's missing,
# Jarvis logs one line and falls back to the plain console — never fails to
# start over a missing GUI dependency.
ui:
  overlay:
    enabled: true
    # "center" opens Jarvis front-and-center on the primary screen, like a
    # real app window — the intended default. Set to a corner
    # (bottom-right | bottom-left | top-right | top-left) for a smaller,
    # out-of-the-way HUD instead. Only used the very first run — after
    # that, wherever you last dragged it wins.
    position: "center"
    corner: "bottom-right"
    # Base scale, not a fixed pixel size: idle is ~0.55x this (a visible
    # ring, not a hidden dot), the active panel is ~1.7x wide by ~1x tall
    # (a glass panel with room for a real equalizer). Sized for a laptop
    # screen — big enough to read as a real HUD, small enough that it
    # doesn't eat a quarter of the display like the old 380 base did.
    size: 220
    margin: 40   # distance from the chosen screen corner, in pixels — only used when position is a corner

# ---------------- Storage ----------------
storage:
  db: "data/jarvis.db"
  audit_log: "logs/audit.jsonl"

  # How many past conversation turns to inject at session start. Tool calls
  # are NOT counted — they stay in the database for the audit trail but are
  # kept out of the prompt, where raw shell JSON was eating a third of the
  # window. Anything older than this window is still reachable via the
  # search_history tool, so this is a recency buffer, not a memory limit.
  context_turns: 40

# ---------------- Memory ----------------
memory:
  # After each conversation, a cheap text model reads what was SAID and pulls
  # out durable facts (project paths, names, preferences, ongoing work) into
  # permanent memory. Runs in the background, never blocks a conversation.
  #
  # Without this, memory only grows when the model volunteers a `remember`
  # call — which in practice it almost never does.
  auto_facts: true
